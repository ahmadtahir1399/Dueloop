name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Web app production build
        run: pnpm web:build

      - name: Simulator smoke run (must be deterministic and violation-free)
        run: |
          pnpm --silent sim --days 90 --invoices 500 --seed 42 > sim-a.txt
          pnpm --silent sim --days 90 --invoices 500 --seed 42 > sim-b.txt
          cmp sim-a.txt sim-b.txt
          cat sim-a.txt

      # Supabase CLI comes from the lockfile (devDependency `supabase`), the same version as locally.
      # supabase/config.toml disables services Phase 2 does not need (studio, storage, realtime, ...).
      - name: Start local Supabase (migrations + seed)
        run: pnpm exec supabase start

      - name: Reset applies migrations and seed cleanly (second time)
        run: pnpm exec supabase db reset

      - name: Database tests (pgTAP + integration)
        run: pnpm db:test

      - run: pnpm db:rls-check
      - run: pnpm db:types:check

      - name: Import dry run, then the same import twice with identical counts
        run: |
          ARGS="--tenant 5eed0000-0000-4000-8000-00000000000a --file packages/ingest/fixtures/messy-eu.csv --mapping packages/ingest/fixtures/mappings/eu.json --options packages/ingest/fixtures/options/de-dmy.json --skip-invalid"
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY)=' | sed -E 's/^API_URL=/export SUPABASE_URL=/; s/^SERVICE_ROLE_KEY=/export SUPABASE_SERVICE_ROLE_KEY=/')"
          pnpm run import $ARGS --dry-run
          pnpm import:twice $ARGS

      # Phase 3. Chaos runs inside db:test (packages/worker/test-db); the explicit step makes a failure obvious.
      - name: Chaos (failpoints at every send step, SIGKILL mid-batch, kill switch mid-batch)
        run: pnpm chaos

      - name: Send demo against the local mail catcher (one email per approved reminder, second run 0 new)
        run: |
          pnpm exec supabase db reset
          pnpm demo:send

      # Phase 4.
      - name: Adversarial suite (prompt injection, spoofing, webhook abuse)
        run: pnpm test:adversarial

      - name: Classifier evaluation (recorded outputs; fails on regression versus the committed baseline)
        run: pnpm classifier:eval

      - name: Replies demo (real webhook / processor path, scripted classifier)
        run: |
          pnpm exec supabase db reset
          pnpm demo:replies
      # Not in CI: pnpm test:load (5,000 invoices, slow), pnpm eval:live (costs money) and the live smoke tests
      # (pnpm smoke:whatsapp, pnpm smoke:whatsapp-webhook). The IMAP test runs GreenMail via docker in db:test.
